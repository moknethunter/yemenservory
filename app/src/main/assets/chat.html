<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دردشة MokAssas</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #007bff; color: white; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    .header input { padding: 5px; border-radius: 5px; border: none; font-size: 12px; direction: ltr; }
    .header button { background: white; color: #007bff; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; word-wrap: break-word; font-size: 14px; }
    .msg.mine { background-color: #007bff; color: white; align-self: flex-start; }
    .msg.theirs { background-color: #e9ecef; color: black; align-self: flex-end; }
    .input-area { display: flex; gap: 5px; padding: 10px; background: white; border-top: 1px solid #ddd; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
    button.send-btn { padding: 10px 20px; border: none; border-radius: 20px; background: #28a745; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <span>💬 MokAssas</span>
      <button onclick="window.history.back()">رجوع</button>
    </div>
    <div class="header-row">
      <input type="text" id="my-key" placeholder="مفتاحي السري" onchange="saveKeys()">
      <button onclick="registerDevice()">تسجيل جهاز جديد</button>
    </div>
    <div class="header-row">
      <input type="text" id="to-key" placeholder="مفتاح الطرف الآخر (لإرسال رسالة)" onchange="saveKeys()">
    </div>
  </div>

  <div class="chat-box" id="mokassas-chat-box"></div>

  <div class="input-area">
    <input type="text" id="mokassas-msg-input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') mokassasSendMessage()">
    <button class="send-btn" onclick="mokassasSendMessage()">إرسال</button>
  </div>

  <script>
    const API_URL = 'https://mokassas-production.up.railway.app/api';
    let lastMessageId = 0;
    let polling;

    // تحميل المفاتيح المحفوظة سابقاً
    window.onload = () => {
      document.getElementById('my-key').value = localStorage.getItem('myKey') || '';
      document.getElementById('to-key').value = localStorage.getItem('toKey') || '';
      startPolling();
    };

    function saveKeys() {
      localStorage.setItem('myKey', document.getElementById('my-key').value.trim());
      localStorage.setItem('toKey', document.getElementById('to-key').value.trim());
      lastMessageId = 0;
      document.getElementById('mokassas-chat-box').innerHTML = '';
    }

    // تسجيل جهاز جديد والحصول على مفتاح
    async function registerDevice() {
      const name = prompt('أدخل اسماً لهذا الجهاز (مثلاً: هاتف أحمد):');
      if (!name) return;
      try {
        const res = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deviceName: name })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('my-key').value = data.apiKey;
          saveKeys();
          alert('تم التسجيل بنجاح! مفتاحك هو: \n' + data.apiKey + '\n\nانسخه وأعطه للطرف الآخر.');
        }
      } catch (e) { alert('فشل التسجيل: ' + e.message); }
    }

    async function mokassasSendMessage() {
      const myKey = document.getElementById('my-key').value.trim();
      const toKey = document.getElementById('to-key').value.trim();
      const input = document.getElementById('mokassas-msg-input');
      const text = input.value.trim();

      if (!myKey) return alert('أدخل مفتاحك السري أولاً');
      if (!toKey) return alert('أدخل مفتاح الطرف الآخر');
      if (!text) return;

      input.value = '...';
      try {
        const res = await fetch(`${API_URL}/chat/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-API-Key': myKey },
          body: JSON.stringify({ toKey: toKey, text: text })
        });
        const data = await res.json();
        if (res.ok) {
          input.value = '';
          appendMessage(text, true);
        } else {
          alert('فشل: ' + data.message); input.value = text;
        }
      } catch (e) { alert('خطأ: ' + e.message); input.value = text; }
    }

    function startPolling() {
      clearInterval(polling);
      polling = setInterval(async () => {
        const myKey = document.getElementById('my-key').value.trim();
        if (!myKey) return;

        try {
          const res = await fetch(`${API_URL}/chat/messages?lastId=${lastMessageId}`, {
            headers: { 'X-API-Key': myKey }
          });
          const data = await res.json();
          if (data.success && data.messages.length > 0) {
            data.messages.forEach(msg => {
              appendMessage(msg.text, false);
              lastMessageId = msg.id;
            });
          }
        } catch (e) { console.log('Polling error'); }
      }, 3000);
    }

    function appendMessage(text, isMine) {
      const box = document.getElementById('mokassas-chat-box');
      const div = document.createElement('div');
      div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
